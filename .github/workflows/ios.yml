name: iOS quality
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version
      - name: Core and persistence tests
        run: swift test --package-path Packages/TrialKit
      - name: Choose an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "TRIAL_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and UI tests
        run: xcodebuild test -project TrialScope.xcodeproj -scheme TrialScope -destination "platform=iOS Simulator,id=$TRIAL_SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO -resultBundlePath TestResults.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-test-results
          path: TestResults.xcresult
